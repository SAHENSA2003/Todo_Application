<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Application </title>
    <style>
        * {
            font-family: sans-serif;
        }

        .navbar {
            display: flex;
            top: 0;
            left: 0;
            background-color: #a3a311;
            justify-content: space-between;
        }

        .navbar .left {
            margin-left: 20px;
            font-size: 30px;
            padding: 4px 4px 4px 4px;
            font-weight: bold;
        }

        .navbar .right {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            list-style: none;
            margin-right: 20px;
        }

        .navbar .right li:hover {
            font-weight: bolder;
            cursor: pointer;
        }

        .main_application {
            border-radius: 15px;
            height: 90vh;
            width: 70vw;
            margin: auto;
            background-color: #ffddff;
        }

        .demo {
            font-weight: 40px;
        }

        .add_todo {
            text-align: center;
        }

        .input {
            display: flex;
            gap: 5px;
            align-items: center;
            justify-content: center;
        }

        .input input {
            border: none;
            outline: none;
        }

        .input button {
            padding: 8px 8px;
            border-radius: 8px;
            min-width: 80px;
            border: none;
            outline: none;
            color: white;
            background-color: #1671bd;

        }

        .edit,
        .delete {
            border: none;
            background-color: violet;
            border-radius: 5px;
            padding: 5px 5px;
        }

        .input button:hover,
        .edit:hover,
        .delete:hover {
            font-weight: bold;
            background-color: #0db3f5;
            cursor: pointer;
            border: 1px solid #0db3f5;
            color: #ffffff;
        }

        .input .input_item {
            width: 70%;
            height: 30px;
            border-radius: 15px;

        }

        .your {
            text-align: center;
        }

        .todos_container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            overflow: scroll;
            max-height: 60%;
            overflow-y: scroll;
            scrollbar-width: none;
        }

        .todos_container::-webkit-scrollbar {
            display: none;
        }

        .todos {
            display: flex;
            justify-content: space-between;
            width: 70%;
            border-radius: 20px;
            background-color: #c5f5fd;
        }

        .disabled {
            pointer-events: none;
            opacity: 0.5;
        }

        .todos .check {
            display: flex;
            gap: 5px;
        }

        .todos .btn {
            margin-left: 20px;
            display: flex;
            gap: 5px;
            padding-right: 20px;
            justify-content: center;
            align-items: center;

        }

        .your {
            color: #ff0000;
        }

        .check input {
            cursor: pointer;
        }

        @media (max-width:1024px) {

            .input button:active,
            .edit:active,
            .delete:active {
                font-weight: bold;
                background-color: #0db3f5;
                cursor: pointer;
                border: 1px solid #0db3f5;
                color: #ffffff;
            }
        }

        @media (max-width:600px) {
            .todos {
                width: 80vw;
                margin: auto;
            }

            .main_application {
                width: 100vw;
            }

            .todos_container {
                overflow-y: scroll;
            }

            .demo,
            .add_todo,
            .your,
            .navbar .left {
                font-size: 15px;
            }

            .todos .btn button svg {
                height: 15px;
                width: 15px;
            }


        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="left">iManager</div>
        <div class="right">
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
        </div>
    </nav>
    <div class="main_application">
        <h1 class="demo">i task Manager every thing at one place</h1>
        <h1 class="add_todo">ADD YOUR TODO</h1>
        <div class="input">
            <input class="input_item" type="text" placeholder="Add item...">
            <button class="save">SAVE</button>
        </div>
        <h1 class="your"></h1>
        <div class="todos_container">

        </div>
    </div>

    <script>

        console.log('Todo App with Local Storage');

        document.querySelector('.your').innerHTML = 'NO TODO IS TO BE SEEN';

        const EditIcon = `<svg height='20px' width='20px' xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#ffff"><path d="M15.7279 9.57627L14.3137 8.16206L5 17.4758V18.89H6.41421L15.7279 9.57627ZM17.1421 8.16206L18.5563 6.74785L17.1421 5.33363L15.7279 6.74785L17.1421 8.16206ZM7.24264 20.89H3V16.6473L16.435 3.21231C16.8256 2.82179 17.4587 2.82179 17.8492 3.21231L20.6777 6.04074C21.0682 6.43126 21.0682 7.06443 20.6777 7.45495L7.24264 20.89Z"></path></svg>`;
        const DeleteIcon = `<svg height='20px' width='20px' xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#fff"><path d="M4 8H20V21C20 21.5523 19.5523 22 19 22H5C4.44772 22 4 21.5523 4 21V8ZM6 10V20H18V10H6ZM9 12H11V18H9V12ZM13 12H15V18H13V12ZM7 5V3C7 2.44772 7.44772 2 8 2H16C16.5523 2 17 2.44772 17 3V5H22V7H2V5H7ZM9 4V5H15V4H9Z"></path></svg>`;

        let Uid = 0;
        let save_btn = document.querySelector('.save');
        let EditDiv = null;
        let Editing = false;
        function select(elementName) {
            return document.querySelector(elementName);
        }

        // Save all current todos to localStorage
        function updateLocalStorage() {
            let allTodos = [];
            document.querySelectorAll('.todos').forEach(tododiv => {
                let text = tododiv.querySelector('p').textContent;
                let ischecked = tododiv.querySelector('input[type="checkBox"]').checked;
                allTodos.push({ text: text, check: ischecked });
            });
            localStorage.setItem('todos', JSON.stringify(allTodos));
        }
        // Load saved todos when the page opens
        function loadTodos() {
            let alReadySave = JSON.parse(localStorage.getItem('todos')) || [];
            alReadySave.forEach(Todo => {
                createTodo(Todo.text, Todo.check);
            })
        }

        // Function to create a todo in the DOM
        function createTodo(pont1, isChecked = false) {
            let todos = document.querySelector('.todos_container');
            Uid++;
            let editId = `Abc${Uid}`;
            let deleteId = `Pqr${Uid}`;
            let todoId = `Todo${Uid}`;
            let textId = `Text${Uid}`;
            let check2 = `check${Uid}`;

            let div = document.createElement('div');
            div.id = todoId;
            div.className = 'todos';
            div.innerHTML = ` <div class='check'>
          <input id='${check2}' type="checkbox">
          <p id='${textId}'>${pont1}</p>
        </div>
        <div class='btn'>
          <button class='edit' id='${editId}' class='edit'>${EditIcon}</button>
          <button  id='${deleteId}' class='delete'>${DeleteIcon}</button>
        </div>`

            console.log(div)
            todos.appendChild(div);

            // Update heading
            if (document.querySelector(".todos_container").innerHTML.trim() === '') {
                document.querySelector('.your').textContent = 'NO TODO IS TO BE SEEN';
            } else {
                document.querySelector('.your').innerHTML = 'YOUR TODOS 👇';
                document.querySelector('.your').style.color = 'black';
            }

            let WholeTodo = document.querySelector(`#${todoId}`);
            let textofTodo = document.querySelector(`#${textId}`);
            let checkBox = WholeTodo.querySelector(`#${check2}`);

            textofTodo.style.textDecoration = 'line-through';
            textofTodo.style.fontStyle = 'italic';

            // Handle checkbox

            // Set initial state
            if (isChecked) {
                checkBox.checked = true;
                textofTodo.style.textDecoration = 'none';
                textofTodo.style.color = 'blue';
                textofTodo.style.fontWeight = 'bold';
                textofTodo.style.fontStyle = 'normal';
            }

            // Handle future clicks ← ADD THIS!
            checkBox.addEventListener('change', () => {
                if (checkBox.checked) {
                    textofTodo.style.textDecoration = 'none';
                    textofTodo.style.color = 'blue';
                    textofTodo.style.fontWeight = 'bold';
                    textofTodo.style.fontStyle = 'normal';
                } else {
                    textofTodo.style.textDecoration = 'line-through';
                    textofTodo.style.color = 'black';
                    textofTodo.style.fontWeight = 'none';
                    textofTodo.style.fontStyle = 'italic';
                }
                updateLocalStorage();
            });
            function activeEditing() {
                if (Editing) {
                    alert('You should update your CurrentEdit edit first.')
                    return true;
                }
                return false;
            }
            // Edit button
            document.querySelector(`#${editId}`).addEventListener('click', () => {
                if (activeEditing()) return

                EditDiv = div;
                Editing = true;
                document.querySelector('.input_item').value = textofTodo.textContent;
                document.querySelector('.input_item').focus();
                save_btn.textContent = 'update';
                EditDiv.classList.add('disabled');

                updateLocalStorage();
            });

            // Delete button
            document.querySelector(`#${deleteId}`).addEventListener('click', () => {
                if (activeEditing()) return

                let Confirm = confirm(`Are you sure to remove task (${div.querySelector('p').textContent})`);
                if (!Confirm) return;

                WholeTodo.remove();
                updateLocalStorage();
                select('.input_item').value = '';

                if (document.querySelector(".todos_container").innerHTML.trim() === '') {
                    document.querySelector('.your').textContent = 'NO TODO IS TO BE SEEN';
                    document.querySelector('.your').style.color = 'red';
                }
            });

            updateLocalStorage();
        }
        function EditTask() {
            let EditValue = select('.input_item').value;
            if (EditValue === '') {
                alert('Task cannot be blank or null');
                select('.input_item').focus();
                return
            }
            EditDiv.querySelector('p').textContent = EditValue;
            EditDiv.classList.remove('disabled');
            // reset Div
            EditDiv = null;
            select('.input_item').value = '';
            save_btn.textContent = 'SAVE';
            Editing = false;
            updateLocalStorage();

        }
        // Save button click handler
        save_btn.addEventListener('click', () => {
            if (Editing) {
                EditTask();
                return;
            }


            let pont1 = document.querySelector('.input_item').value;
            if (select('.input_item').value === '') {
                alert('Give task description first!!')
                document.querySelector('.input_item').focus();
            } else {
                createTodo(pont1);
                document.querySelector('.input_item').value = '';
            }
        });

        // Load saved todos when app starts
        loadTodos();
    </script>

</body>

</html>
